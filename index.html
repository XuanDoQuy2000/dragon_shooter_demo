<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101426" />
    <!-- Safari on iPhone has no fullscreen for a page; added to the home screen it opens without its bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rồng Con" />
    <title>Rồng Con Giữ Trời</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101426;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /*
        The loading screen is here, not in the script, so it shows while the script itself downloads.
        src/ui/loading-screen.ts fills in its words, moves the bar and takes it away. A stand-in until
        the platform SDK has its own loading screen.
      */
      #loading {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 24px env(safe-area-inset-bottom);
        background: linear-gradient(#78c3ef, #bde4f8 55%, #b4e2e8);
        color: #2b2440;
        text-align: center;
        font-family: "Baloo 2", system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .gap {
        flex: 3;
      }
      #loading .gap.end {
        flex: 2;
      }
      #loading svg {
        width: 140px;
        height: auto;
        margin-bottom: 22px;
        animation: loading-drift 3.2s ease-in-out infinite alternate;
      }
      /* Empty until the game font is in, but already as tall, so nothing moves when the words come. */
      #loading h1 {
        margin: 0 0 26px;
        min-height: 35px;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.15;
      }
      #loading p {
        margin: 12px 0 0;
        min-height: 20px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
        opacity: 0.7;
      }
      #loading .words {
        transition: opacity 0.25s ease;
      }
      #loading .words:empty {
        opacity: 0;
      }
      #loading .bar {
        width: min(240px, 70vw);
        height: 14px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: inset 0 0 0 2px rgba(43, 36, 64, 0.18);
        overflow: hidden;
      }
      /* Creeps to a tenth while the script downloads; the script then sets the share that has loaded. */
      #loading .fill {
        width: 10%;
        height: 100%;
        border-radius: 7px;
        background: #ffd75e;
        box-shadow: inset 0 0 0 2px #e0a024;
        transition: width 0.2s ease-out;
        animation: loading-creep 2.5s ease-out;
      }
      @keyframes loading-creep {
        from {
          width: 0;
        }
      }
      @keyframes loading-drift {
        from {
          transform: translateX(-10px);
        }
        to {
          transform: translateX(10px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading svg,
        #loading .fill {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DFyDzky_.js"></script>
  </head>
  <body>
    <div id="game">
      <div id="loading" data-ui>
        <div class="gap"></div>
        <svg viewBox="-42 -36 84 52" aria-hidden="true">
          <g opacity=".9">
            <ellipse cx="0" cy="6" rx="40" ry="10" fill="#d3e4f3" opacity=".5" />
            <circle cx="-18" cy="0" r="14" fill="#fff" />
            <circle cx="2" cy="-8" r="19" fill="#fff" />
            <circle cx="22" cy="0" r="13" fill="#fff" />
            <rect x="-32" y="0" width="64" height="12" rx="6" fill="#fff" />
          </g>
        </svg>
        <h1 class="words"></h1>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
        <p class="words"></p>
        <div class="gap end"></div>
      </div>
    </div>
  </body>
</html>
